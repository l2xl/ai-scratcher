header: Prompt library
description: |
  Prompt library: a set of named prompts — skills and tools — added to the context automatically or on explicit request by name, in the manner of Claude skills. A tool defines the format of a structured answer the harness recognises and turns into a call, whose result reaches the model with the next turn; a skill is additional description only, so the rules of how to call a tool are themselves a skill. Every prompt is one markdown file under the package's `prompts/` folder named by its stem, opened by a front matter with its `kind` (skill or tool), a `description` and, for a skill, whether it is `default`.
