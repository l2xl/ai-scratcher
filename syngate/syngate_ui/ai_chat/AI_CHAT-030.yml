header: Hide and reopen
description: |
  The chat shall carry a green check mark that hides the chat and becomes a drop-down icon reopening the saved history; while hidden the panel behaves as if no chat existed, and a new chat started there replaces the hidden one at the moment its first message is sent to the AI.
