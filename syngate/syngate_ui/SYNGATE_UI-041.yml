header: Single composite status icon
description: |
  Every place that shows an item shall label it with one composite status icon followed by the ID.

  The icon is a single element: a circle whose fill color carries the test status, with the review glyph rendered over it. The circle's diameter is about 1.4x the glyph font size plus 2px; the eyes are shifted toward the circle's right edge so they still mostly overlap it.

  Test status (circle fill):
  - Green - tests passed
  - Red - tests failed
  - Grey - test status unknown

  Review status (glyph over the circle):
  - Stamp ok - the eyes glyph 👀 (U+1F440)
  - Stamp violated - the same eyes glyph with the red exclamation glyph ❗ (U+2757, no circle) laid over the eyes' right part via CSS, outside of the circle and as tall as the circle
  - No stamp - the circle stays empty (no glyph)
