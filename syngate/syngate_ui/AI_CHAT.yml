header: AI chat in the item panel
description: |
  The AI chat shall be a part of the item's content panel, the item's description being the first message of the exchange and shown once as the content itself; the chat offers selectors for AI connector, model and effort, and a send button. Details: [AI_CHAT.md](AI_CHAT.md).
