header: Syngate API tool
description: |
  The syngate API as a tool of the prompt library, [src/ai_scratcher/prompts/syngate_api.md](src/ai_scratcher/prompts/syngate_api.md): a call addresses an item by UID, `@` standing for the anchored one, and is applied through the syngate API — the writes `add` (`uid`, `parent`, `header`, `description`, `kind` leaf|branch), `edit` (`uid`, `header` and/or `description`), `remove` (`uid`), `move` (`uid`, `to`, `before`, `from`, `link`); the reads `query` (`uid`) and `context` (`uid`); the run `test` (`uid` or glob, `name` narrowing a leaf to one binding), which runs the bound routines through the same runner as the page's ▶ run — every `test` call of a batch joins one run performed after the other calls, and a run live elsewhere refuses it — and hands the outcome back as the next message: one line per leaf binding with pass/fail, then the output of every failed routine. A write of the AI shall never clear a review stamp: the stamp is left standing over the changed content so the change reads as a violated review for the user to settle, where the user's own edit in the page clears it. Review stamping stays the user's act: there is no review call.
parents: [SYNTHETIC-020, AI_CHAT-PROMPTS-TOOLS]
