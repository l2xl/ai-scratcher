header: Syngate API  AI harness
description: |
  Structured AI answer is parsed for requested syngate API calls and then proxied transparently.
  1. Answer format: the whole answer is either plain text or exactly one fenced block tagged `syngate` holding a JSON list of calls, and nothing else. Each call is an object with `tool` — `add` (`uid`, `parent`, `header`, `description`, `kind` leaf|branch), `edit` (`uid`, `header` and/or `description`), `remove` (`uid`), `move` (`uid`, `to`, `before`, `from`, `link`) — where `@` stands for the anchored item and any other item is addressed by its UID. The calls are applied in order through the syngate API; the first refused call stops the batch, and the applied part is reported with the refusal.
  2. In the cases user made UI changes to syngate items clears the review, AI initiated changes makes the review violated in order to highlight the change
