header: Claude Code connector
description: |
  The Claude Code connector shall dispatch a seed context, following local  history and user input through the local `claude` CLI in non-interactive mode — the context as appended system prompt, the input as the prompt text — and return the reply text and the session id read from the CLI's JSON output.
